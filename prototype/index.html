<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZenvX — build an operating system</title>
<meta name="description" content="Drag blocks together and build a Linux distribution. Kid mode for beginners, pro mode for people who read kernel changelogs." />
<link rel="stylesheet" href="./studio.css" />
</head>
<body class="kid">

<div class="app">
	<header>
		<span class="logo">ZenvX</span>
		<span id="count" class="count"></span>
		<span class="spacer"></span>
		<span id="mode" class="seg">
			<button data-mode="kid" aria-pressed="true">Kid mode</button>
			<button data-mode="pro" aria-pressed="false">Pro mode</button>
		</span>
		<button id="run" class="btn primary">Start it</button>
	</header>

	<div class="main">
		<nav id="palette" class="palette" aria-label="Blocks"></nav>
		<div class="canvas-wrap"><div id="canvas" class="canvas"></div></div>
		<aside id="inspector" class="inspector" aria-label="Settings"></aside>
	</div>
</div>

<div id="overlay" class="overlay">
	<div class="machine">
		<div id="screen" class="screen"></div>
		<button id="close" class="btn close">Close</button>
	</div>
</div>

<noscript>
	<p style="padding:24px">The ZenvX prototype needs JavaScript. The framework itself does not.</p>
</noscript>

<script type="module">
	import { mount } from "./app.js"
	mount()
</script>
</body>
</html>
