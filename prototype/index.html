<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZenvX Framework — Studio prototype</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#2C2C2B; --muted:#7D7A75; --canvas:#fff; --soft:#F9F8F7;
    --surface:#F0EFED; --line:#E6E5E3; --brand:#2783DE; --brandSoft:#E5F2FC;
    --good:#46A171; --goodSoft:#E8F1EC; --warn:#D5803B; --warnSoft:#FBEBDE;
    --bad:#E56458; --badSoft:#FCE9E7;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  }
  html,body{margin:0}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink); background:var(--soft); font-size:16px; line-height:1.5;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  .app{display:flex;flex-direction:column;height:664px;min-height:664px;background:var(--soft)}

  /* ---------- header ---------- */
  header{
    height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;
    padding:0 20px;background:var(--canvas);border-bottom:1px solid var(--line)
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
  .mark{width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:15px}
  .osname{
    width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--soft);font:inherit;font-weight:500;color:var(--ink)
  }
  .osname:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
  .spacer{margin-left:auto}
  .meta{font-size:13px;color:var(--muted);white-space:nowrap}
  .modes{display:flex;background:var(--surface);border-radius:9px;padding:3px}
  .modes button{border:0;background:transparent;padding:6px 14px;border-radius:6px;
    font-size:13px;font-weight:500;color:var(--muted)}
  .modes button[aria-selected="true"]{background:var(--canvas);color:var(--ink);box-shadow:var(--shadow)}
  .cta{
    border:0;background:var(--brand);color:#fff;font-weight:600;font-size:14px;
    padding:10px 18px;border-radius:9px;min-height:44px
  }
  .cta[disabled]{background:var(--surface);color:var(--muted);cursor:not-allowed}

  /* ---------- 3-pane body ---------- */
  .body{flex:1;display:flex;min-height:0}
  aside{background:var(--canvas);overflow-y:auto;padding:14px 14px 30px}
  .palette{flex:0 0 214px;border-right:1px solid var(--line)}
  .inspector{flex:0 0 288px;border-left:1px solid var(--line)}
  h2.sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    margin:0 0 8px;font-weight:600}
  .sec-wrap+.sec-wrap{margin-top:18px}
  .pill{
    width:100%;display:flex;align-items:center;gap:10px;text-align:left;
    padding:9px 10px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;
    background:var(--canvas);min-height:44px;font-size:13.5px;font-weight:500
  }
  .pill:hover{border-color:var(--brand);background:var(--brandSoft)}
  .pill:active{cursor:grabbing}
  svg.ic{flex:0 0 auto;color:var(--brand)}

  /* ---------- canvas ---------- */
  .canvas{
    flex:1;min-width:0;position:relative;overflow:hidden;
    background-color:var(--soft);
    background-image:radial-gradient(var(--line) 1.2px, transparent 1.2px);
    background-size:22px 22px
  }
  .canvas.drag{background-color:var(--brandSoft)}
  /* SVG is a replaced element: inset:0 alone leaves it at its intrinsic
     300x150 and clips the wires. Size it explicitly. */
  .wires{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .node{
    position:absolute;background:var(--canvas);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;
    display:flex;align-items:center;gap:10px;cursor:grab;user-select:none;min-width:168px
  }
  .node.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft),var(--shadow)}
  .node .nm{font-size:13.5px;font-weight:600;line-height:1.25}
  .node .id{font-size:11px;color:var(--muted);font-family:Menlo,Consolas,monospace}
  .node .x{border:0;background:transparent;color:var(--muted);width:26px;height:26px;
    border-radius:6px;margin-left:auto;font-size:16px;line-height:1}
  .node .x:hover{background:var(--surface);color:var(--bad)}
  .empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:24px}
  .empty p{max-width:280px;text-align:center;color:var(--muted);font-size:14px;margin:0}
  .empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

  /* ---------- inspector controls ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .choices button{border:1px solid var(--line);border-radius:8px;background:var(--canvas);
    padding:8px;font-size:13px;min-height:40px}
  .choices button[aria-pressed="true"]{border-color:var(--brand);background:var(--brandSoft);font-weight:600}
  .field input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;font:inherit;font-size:13.5px}
  .field input[type=text]:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
  .field input[type=color]{width:56px;height:36px;border:1px solid var(--line);border-radius:8px;
    background:var(--canvas);padding:2px}
  .sw{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
  .sw input{width:18px;height:18px;accent-color:var(--brand)}
  .blurb{font-size:13px;color:var(--muted);margin:2px 0 12px}
  .issue{font-size:13px;border-radius:8px;padding:8px 10px;margin-bottom:6px}
  .issue.error{background:var(--badSoft);color:#8a2f26}
  .issue.warn{background:var(--warnSoft);color:#7a4715}
  .issue.hint{background:var(--surface);color:var(--muted)}
  .issue.ok{background:var(--goodSoft);color:#255c3d}
  .files{margin:0;padding:0;list-style:none;font-family:Menlo,Consolas,monospace;font-size:11px;color:var(--muted)}
  .files li{padding:3px 0;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meter{height:6px;border-radius:3px;background:var(--surface);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:var(--brand)}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
  .kv span:last-child{font-weight:600}

  .pro-only{display:none}
  body.pro .pro-only{display:block}
  body.kid .palette .pill{font-size:14.5px;padding:11px 10px}

  /* ---------- simulator ---------- */
  .sim{position:absolute;inset:0;background:rgba(25,25,25,.72);display:grid;place-items:center;padding:22px;z-index:20}
  .machine{width:100%;max-width:720px;border-radius:14px;overflow:hidden;background:#191919;
    box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .chrome{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#202020;
    color:rgba(255,255,255,.65);font-size:13px}
  .chrome b{color:#fff;font-weight:600}
  .chrome button{margin-left:auto;border:0;background:rgba(255,255,255,.12);color:#fff;
    padding:5px 12px;border-radius:7px;font-size:12.5px}
  .screen{position:relative;height:392px;overflow:hidden}
  .boot{position:absolute;inset:0;background:#0c0c0c;color:#fff;display:grid;place-items:center;text-align:center}
  .boot .bn{font-size:22px;font-weight:600;letter-spacing:.01em}
  .boot .bar{width:170px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);margin:14px auto 10px;overflow:hidden}
  .boot .bar i{display:block;height:100%;width:34%;background:#fff;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  .boot .bs{font-size:12px;color:rgba(255,255,255,.5)}
  .desk{position:absolute;inset:0}
  .icons{display:grid;grid-template-columns:repeat(auto-fill,76px);gap:6px;padding:18px 18px 0;align-content:start}
  .dicon{border:0;background:transparent;color:#fff;display:flex;flex-direction:column;align-items:center;
    gap:6px;padding:8px 4px;border-radius:10px;font-size:11.5px;text-align:center}
  .dicon:hover{background:rgba(255,255,255,.14)}
  .dicon .box{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
    box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .win{position:absolute;left:96px;top:62px;width:340px;border-radius:11px;overflow:hidden;
    background:#202020;border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .win .t{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#383836;
    color:rgba(255,255,255,.85);font-size:12.5px}
  .win .t button{margin-left:auto;border:0;background:transparent;color:rgba(255,255,255,.7);
    width:24px;height:24px;border-radius:5px;font-size:15px;line-height:1}
  .win .c{padding:14px;height:132px;color:rgba(255,255,255,.6);font-size:12.5px}
  .bar-panel{position:absolute;display:flex;align-items:center;gap:8px;padding:0 10px;
    background:rgba(0,0,0,.42);backdrop-filter:blur(8px);color:rgba(255,255,255,.75);font-size:12px}
  .bar-panel .start{width:24px;height:24px;border-radius:7px}
  .noiso{position:absolute;left:0;right:0;bottom:0;padding:8px 14px;background:rgba(0,0,0,.55);
    color:rgba(255,255,255,.75);font-size:12px}

  @media (max-width:900px){
    .app{height:auto;min-height:0}
    .body{flex-direction:column}
    .palette,.inspector{flex:none;width:auto;border:0;border-bottom:1px solid var(--line)}
    .canvas{height:340px}
    header{flex-wrap:wrap;height:auto;padding:10px 14px;gap:10px}
    .osname{width:120px}
  }
  @media (prefers-reduced-motion:reduce){
    .boot .bar i{animation:none;width:100%}
  }
</style>
</head>
<body class="kid">
<div class="app">
  <header>
    <div class="logo"><span class="mark">Z</span><span>ZenvX Framework</span></div>
    <input class="osname" id="osname" value="AaruOS" aria-label="Name of your operating system">
    <div class="spacer"></div>
    <div class="meta pro-only" id="meta"></div>
    <div class="modes" role="tablist" aria-label="Interface mode">
      <button role="tab" id="mode-kid" aria-selected="true">Kid</button>
      <button role="tab" id="mode-pro" aria-selected="false">Pro</button>
    </div>
    <button class="cta" id="build">Turn it on</button>
  </header>

  <div class="body">
    <aside class="palette" id="palette"></aside>

    <main class="canvas" id="canvas">
      <svg class="wires" id="wires"></svg>
      <div class="empty" id="empty">
        <p><strong>Drag a block in here</strong>Start with <b>The Engine</b>. Then pick a look, then add apps. Press <b>Turn it on</b> whenever you want to see it.</p>
      </div>
    </main>

    <aside class="inspector" id="inspector"></aside>
  </div>
</div>

<script>
/* =========================================================================
   ZenvX Framework — Studio prototype (single file, no dependencies)
   Mirrors packages/schema: BLOCKS -> Recipe -> compileRecipe -> sim + files
   ========================================================================= */

const ICONS = {
  engine:"M4 7h16v10H4z M8 7V4h8v3",
  desktopSimple:"M3 5h18v11H3z M8 20h8 M12 16v4",
  desktopModern:"M3 5h18v11H3z M3 9h18 M8 20h8",
  palette:"M12 3a9 9 0 100 18h2a3 3 0 000-6h-1a3 3 0 010-6h1a3 3 0 000-6z",
  globe:"M12 3a9 9 0 100 18 9 9 0 000-18z M3 12h18 M12 3c3 4 3 14 0 18",
  brush:"M4 20c4 0 4-4 8-8l4 4c-4 4-8 4-8 4z M14 8l4-4 2 2-4 4z",
  code:"M9 8l-4 4 4 4 M15 8l4 4-4 4",
  gamepad:"M6 9h12a4 4 0 010 8H6a4 4 0 010-8z M9 13h2 M15 12v2",
  music:"M9 18V6l10-2v12 M9 18a2 2 0 11-4 0 2 2 0 014 0",
  doc:"M6 3h8l4 4v14H6z M14 3v4h4",
  tag:"M4 4h9l7 7-9 9-7-7z",
  user:"M12 4a4 4 0 100 8 4 4 0 000-8z M4 21c0-4 4-6 8-6s8 2 8 6",
  box:"M4 8l8-4 8 4v9l-8 4-8-4z M4 8l8 4 8-4 M12 12v9",
  shield:"M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z",
  disc:"M12 3a9 9 0 100 18 9 9 0 000-18z M12 10a2 2 0 100 4 2 2 0 000-4"
};
const icon = (n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true"><path d="${ICONS[n]||ICONS.box}"/></svg>`;

const WALLS = {
  space:"linear-gradient(155deg,#0f1a2e 0%,#1c3f6e 55%,#2783DE 100%)",
  forest:"linear-gradient(155deg,#11241b 0%,#25523a 55%,#46A171 100%)",
  sunset:"linear-gradient(155deg,#2e1616 0%,#7a3b22 55%,#D5803B 100%)",
  plain:"linear-gradient(155deg,#191919 0%,#2b2b2a 60%,#383836 100%)"
};

/* ---------------------------- block catalog ---------------------------- */
const app = (id,label,kid,ic,blurb,pkgs,mb) => ({
  id, cat:"apps", label, kid, icon:ic, blurb,
  inputs:["desktop"], outputs:["app"],
  emit:()=>({packages:pkgs, sizeMb:mb, sim:{desktopIcons:[{label:kid,icon:ic}]}})
});

const BLOCKS = [
  { id:"base.debian", cat:"start", label:"Debian 13 (stable)", kid:"The Engine", icon:"engine",
    blurb:"The part that makes the computer turn on.", inputs:[], outputs:["system"], one:true,
    fields:[{k:"arch",l:"Architecture",t:"choice",d:"amd64",o:[["amd64","64-bit PC"],["arm64","ARM64"]]}],
    emit:c=>({packages:["linux-image-"+(c.arch||"amd64"),"live-boot","systemd-sysv","network-manager"],
      lb:{distribution:"trixie",architectures:c.arch||"amd64",archive_areas:"main contrib non-free-firmware"},
      sizeMb:720}) },

  { id:"desktop.xfce", cat:"looks", label:"XFCE 4", kid:"Simple Desktop", icon:"desktopSimple",
    blurb:"Light and fast. Great on old computers.", inputs:["system"], outputs:["desktop"], one:true,
    fields:[{k:"panel",l:"Where is the bar?",t:"choice",d:"bottom",o:[["bottom","Bottom"],["top","Top"],["left","Left side"]]}],
    emit:c=>({packages:["xfce4","xfce4-terminal","thunar","lightdm","xserver-xorg"],
      sizeMb:420, sim:{panel:c.panel||"bottom",radius:"6px"}}) },

  { id:"desktop.gnome", cat:"looks", label:"GNOME 48", kid:"Modern Desktop", icon:"desktopModern",
    blurb:"Big, smooth and touch friendly.", inputs:["system"], outputs:["desktop"], one:true,
    fields:[{k:"panel",l:"Where is the bar?",t:"choice",d:"top",o:[["top","Top"],["bottom","Bottom"],["left","Left side"]]}],
    emit:c=>({packages:["gnome-core","gnome-terminal","nautilus","gdm3"],
      sizeMb:1400, sim:{panel:c.panel||"top",radius:"12px"}}) },

  { id:"look.theme", cat:"looks", label:"Theme & wallpaper", kid:"Colours", icon:"palette",
    blurb:"Pick your colour and your background.", inputs:["desktop"], outputs:["look"], one:true,
    fields:[
      {k:"accent",l:"Favourite colour",t:"color",d:"#2783DE"},
      {k:"wall",l:"Background",t:"choice",d:"space",o:[["space","Space"],["forest","Forest"],["sunset","Sunset"],["plain","Plain"]]}
    ],
    emit:c=>({packages:["papirus-icon-theme","fonts-inter"], sizeMb:40,
      files:[{path:"etc/zenvx/theme.conf",content:`accent=${c.accent||"#2783DE"}\nwallpaper=${c.wall||"space"}\n`}],
      sim:{accent:c.accent||"#2783DE", wall:WALLS[c.wall||"space"]}}) },

  app("app.browser","Firefox ESR","Internet","globe","Look things up on the web.",["firefox-esr"],260),
  app("app.paint","Pinta","Paint","brush","Draw and colour things.",["pinta"],120),
  app("app.code","VS Codium","Code","code","Write your own programs.",["codium"],340),
  app("app.games","Games pack","Games","gamepad","Chess, mines, solitaire.",["gnome-games"],180),
  app("app.media","VLC","Music & Video","music","Play music and videos.",["vlc"],150),
  app("app.office","LibreOffice","Homework","doc","Documents and sums.",["libreoffice"],780),

  { id:"identity.brand", cat:"me", label:"Distro identity", kid:"Name It", icon:"tag",
    blurb:"Your OS gets its own name and tagline.", inputs:["system"], outputs:["identity"], one:true,
    fields:[{k:"tagline",l:"Tagline",t:"text",d:"My very own computer"}],
    emit:c=>({sizeMb:1, files:[{path:"etc/zenvx/brand.conf",content:`TAGLINE="${c.tagline||""}"\n`}],
      sim:{tagline:c.tagline}}) },

  { id:"identity.user", cat:"me", label:"User account", kid:"That's Me", icon:"user",
    blurb:"Who is going to use this computer?", inputs:["system"], outputs:["identity"], one:true,
    fields:[{k:"username",l:"Username",t:"text",d:"aaru"},{k:"auto",l:"Log in automatically",t:"toggle",d:true}],
    emit:c=>({sizeMb:1, hooks:[`useradd -m -s /bin/bash ${c.username||"aaru"}`],
      files:(c.auto===false?[]:[{path:"etc/lightdm/lightdm.conf.d/90-autologin.conf",
        content:`[Seat:*]\nautologin-user=${c.username||"aaru"}\n`}]), sim:{user:c.username||"aaru"}}) },

  { id:"identity.locale", cat:"me", label:"Language & region", kid:"My Language", icon:"globe",
    blurb:"Words, keyboard and clock.", inputs:["system"], outputs:["identity"], one:true,
    fields:[{k:"locale",l:"Language",t:"choice",d:"en_IN",
      o:[["en_IN","English (IN)"],["ml_IN","Malayalam"],["hi_IN","Hindi"],["en_US","English (US)"]]}],
    emit:c=>({sizeMb:80,
      packages:c.locale==="ml_IN"?["locales","fonts-noto","fonts-smc","ibus-m17n"]:["locales","fonts-noto"],
      lb:{bootappend_live:`boot=live locales=${c.locale||"en_IN"}.UTF-8`}}) },

  { id:"hood.packages", cat:"hood", label:"Extra packages", kid:"More Stuff", icon:"box",
    blurb:"Any Debian package, comma separated.", inputs:["system"], outputs:["app"], pro:true,
    fields:[{k:"list",l:"Packages",t:"text",d:"htop, git, neovim"}],
    emit:c=>({sizeMb:50, packages:String(c.list||"").split(",").map(s=>s.trim()).filter(Boolean)}) },

  { id:"hood.firewall", cat:"hood", label:"Firewall (nftables)", kid:"Shield", icon:"shield",
    blurb:"Block incoming connections by default.", inputs:["system"], outputs:["app"], pro:true,
    emit:()=>({packages:["nftables"], sizeMb:10, services:["nftables"]}) },

  { id:"output.iso", cat:"finish", label:"Bootable ISO", kid:"Make It Real", icon:"disc",
    blurb:"A file you can put on a USB stick.", inputs:["system"], outputs:["image"], one:true,
    fields:[{k:"installer",l:"Include installer",t:"toggle",d:true}],
    emit:c=>({lb:{binary_images:"iso-hybrid"}, sizeMb:c.installer===false?0:120,
      packages:c.installer===false?[]:["calamares","calamares-settings-debian"], sim:{iso:true}}) }
];
const byId = id => BLOCKS.find(b=>b.id===id);
const CATS = [
  ["start","Start here","Base system"],
  ["looks","Looks","Desktop & theme"],
  ["apps","Apps","Applications"],
  ["me","Me","Identity & locale"],
  ["hood","Advanced","Under the hood"],
  ["finish","Finish","Output target"]
];

/* ------------------------------- state -------------------------------- */
let mode = "kid";
let seq = 0;
const recipe = { zenvxVersion:1, name:"AaruOS", blocks:[], edges:[] };
let selected = null;

const cfgOf = b => {
  const def = byId(b.def), out = {};
  (def.fields||[]).forEach(f => out[f.k] = (f.k in b.cfg) ? b.cfg[f.k] : f.d);
  return out;
};

/* --------------------------- graph validation -------------------------- */
function canConnect(fromUid,toUid){
  if (fromUid===toUid) return false;
  const f=byId(recipe.blocks.find(b=>b.uid===fromUid)?.def||"");
  const t=byId(recipe.blocks.find(b=>b.uid===toUid)?.def||"");
  if(!f||!t) return false;
  if(!t.inputs.some(i=>f.outputs.includes(i))) return false;
  if(recipe.edges.some(e=>e.from===fromUid&&e.to===toUid)) return false;
  const seen=new Set();
  const walk=u=>u===fromUid?true:(seen.has(u)?false:(seen.add(u),
    recipe.edges.filter(e=>e.from===u).some(e=>walk(e.to))));
  return !walk(toUid);
}

function validate(){
  const out=[], defs=recipe.blocks.map(b=>byId(b.def));
  if(!recipe.name.trim()) out.push(["error","Your OS needs a name."]);
  if(!defs.some(d=>d.outputs.includes("system")))
    out.push(["error","Add The Engine so the computer can turn on."]);
  if(defs.length && !defs.some(d=>d.outputs.includes("desktop")))
    out.push(["warn","No desktop yet, so you would only see text on screen."]);
  if(defs.some(d=>d.outputs.includes("system")) && !defs.some(d=>d.outputs.includes("image")))
    out.push(["hint","Add Make It Real to get a file you can boot from a USB stick."]);
  recipe.blocks.forEach(b=>{
    const d=byId(b.def);
    if(d.inputs.length && !recipe.edges.some(e=>e.to===b.uid))
      out.push(["warn",`“${label(d)}” is not joined to anything yet.`,b.uid]);
  });
  return out;
}

/* ------------------------------- compile ------------------------------- */
function compile(){
  const cs = recipe.blocks.map(b=>byId(b.def).emit(cfgOf(b)));
  const packages=[...new Set(cs.flatMap(c=>c.packages||[]))].sort();
  const lb=Object.assign({binary_images:"iso-hybrid"},...cs.map(c=>c.lb||{}));
  const sim=Object.assign({panel:"bottom",accent:"#2783DE",wall:WALLS.space,radius:"10px"},
    ...cs.map(c=>{const s={...(c.sim||{})};delete s.desktopIcons;return s}));
  sim.desktopIcons=cs.flatMap(c=>c.sim?.desktopIcons||[]);
  const estMb=cs.reduce((n,c)=>n+(c.sizeMb||0),0);
  const files=[
    "auto/config",
    "build.sh",
    "config/package-lists/zenvx.list.chroot",
    "config/includes.chroot/etc/os-release",
    "config/includes.chroot/etc/zenvx/recipe.json",
    "config/hooks/normal/9000-zenvx.hook.chroot",
    ...cs.flatMap(c=>(c.files||[]).map(f=>"config/includes.chroot/"+f.path))
  ];
  return {packages,lb,sim,estMb,files};
}

/* ------------------------------ rendering ------------------------------ */
const label = d => mode==="kid" ? d.kid : d.label;
const $ = s => document.querySelector(s);
const canvas=$("#canvas"), wires=$("#wires");

function renderPalette(){
  $("#palette").innerHTML = CATS.map(([cat,kidName,proName])=>{
    const list = BLOCKS.filter(b=>b.cat===cat && (mode==="pro" || !b.pro));
    if(!list.length) return "";
    return `<section class="sec-wrap"><h2 class="sec">${mode==="kid"?kidName:proName}</h2>` +
      list.map(b=>`<button class="pill" draggable="true" data-def="${b.id}" title="${b.blurb}">
        ${icon(b.icon, mode==="kid"?22:20)}<span>${label(b)}</span></button>`).join("") +
      `</section>`;
  }).join("");

  $("#palette").querySelectorAll(".pill").forEach(el=>{
    el.addEventListener("dragstart", e=>e.dataTransfer.setData("text/plain", el.dataset.def));
    el.addEventListener("click", ()=>addBlock(el.dataset.def));
  });
}

function renderCanvas(){
  canvas.querySelectorAll(".node").forEach(n=>n.remove());
  $("#empty").style.display = recipe.blocks.length ? "none" : "grid";

  recipe.blocks.forEach(b=>{
    const d=byId(b.def);
    const el=document.createElement("div");
    el.className="node"+(selected===b.uid?" sel":"");
    el.style.left=b.pos.x+"px"; el.style.top=b.pos.y+"px";
    el.dataset.uid=b.uid;
    el.innerHTML = icon(d.icon, mode==="kid"?24:20) +
      `<div><div class="nm">${label(d)}</div><div class="id pro-only">${d.id}</div></div>` +
      `<button class="x" aria-label="Remove block">\\u00d7</button>`;
    canvas.appendChild(el);

    el.querySelector(".x").addEventListener("click", ev=>{ ev.stopPropagation(); removeBlock(b.uid); });
    el.addEventListener("mousedown", ev=>startDrag(ev, b, el));
  });
  drawWires();
}

function drawWires(){
  const nodes={}; canvas.querySelectorAll(".node").forEach(n=>nodes[n.dataset.uid]=n);
  wires.innerHTML = recipe.edges.map(e=>{
    const a=nodes[e.from], b=nodes[e.to]; if(!a||!b) return "";
    const x1=a.offsetLeft+a.offsetWidth/2, y1=a.offsetTop+a.offsetHeight;
    const x2=b.offsetLeft+b.offsetWidth/2, y2=b.offsetTop;
    const my=(y1+y2)/2;
    return `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"
      fill="none" stroke="#2783DE" stroke-width="2.5" stroke-opacity=".85"/>`
      + `<circle cx="${x2}" cy="${y2}" r="3" fill="#2783DE"/>`;
  }).join("");
}

function renderInspector(){
  const b = recipe.blocks.find(x=>x.uid===selected);
  const c = compile();
  const issues = validate();
  const gb = (c.estMb/1024);
  let html = "";

  if(b){
    const d=byId(b.def), cfg=cfgOf(b);
    html += `<section class="sec-wrap"><h2 class="sec">Settings</h2>
      <div style="font-weight:600;font-size:15px">${label(d)}</div>
      <p class="blurb">${d.blurb}</p>`;
    (d.fields||[]).forEach(f=>{
      html += `<div class="field"><label>${f.l}</label>`;
      if(f.t==="choice") html += `<div class="choices">` + f.o.map(([v,l])=>
        `<button data-k="${f.k}" data-v="${v}" aria-pressed="${cfg[f.k]===v}">${l}</button>`).join("")+`</div>`;
      else if(f.t==="toggle") html += `<label class="sw"><input type="checkbox" data-k="${f.k}"
        ${cfg[f.k]!==false?"checked":""}> Yes</label>`;
      else if(f.t==="color") html += `<input type="color" data-k="${f.k}" value="${cfg[f.k]}">`;
      else html += `<input type="text" data-k="${f.k}" value="${String(cfg[f.k]??"").replace(/"/g,"&quot;")}">`;
      html += `</div>`;
    });
    if(!(d.fields||[]).length) html += `<p class="blurb">Nothing to set up. It just works.</p>`;
    html += `</section>`;
  } else {
    html += `<section class="sec-wrap"><h2 class="sec">Your computer</h2>
      <div class="kv"><span>Blocks</span><span>${recipe.blocks.length}</span></div>
      <div class="kv"><span>Apps installed</span><span>${c.sim.desktopIcons.length}</span></div>
      <div class="kv"><span>Size on disk</span><span>${gb.toFixed(1)} GB</span></div>
      <div class="meter"><i style="width:${Math.min(100,gb/4*100).toFixed(0)}%"></i></div>
      <p class="blurb" style="margin-top:8px">Tap a block on the canvas to change it.</p></section>`;
  }

  html += `<section class="sec-wrap"><h2 class="sec">Checks</h2>` +
    (issues.length ? issues.map(([lv,msg])=>`<div class="issue ${lv}">${msg}</div>`).join("")
                   : `<div class="issue ok">Everything looks good. Press Turn it on.</div>`) +
    `</section>`;

  html += `<section class="sec-wrap pro-only"><h2 class="sec">Generated live-build tree</h2>
    <ul class="files">${c.files.map(f=>`<li>${f}</li>`).join("")}</ul>
    <div class="kv" style="margin-top:8px"><span>Packages</span><span>${c.packages.length}</span></div>
    <div class="kv"><span>Suite</span><span>${c.lb.distribution||"—"}</span></div></section>`;

  const ins=$("#inspector");
  ins.innerHTML = html;

  ins.querySelectorAll(".choices button").forEach(el=>el.addEventListener("click",()=>{
    b.cfg[el.dataset.k]=el.dataset.v; render();
  }));
  ins.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener("change",()=>{
    b.cfg[el.dataset.k]=el.checked; render();
  }));
  ins.querySelectorAll('input[type=color]').forEach(el=>el.addEventListener("input",()=>{
    b.cfg[el.dataset.k]=el.value; render();
  }));
  ins.querySelectorAll('input[type=text]').forEach(el=>el.addEventListener("input",()=>{
    b.cfg[el.dataset.k]=el.value; renderHeader();
  }));
}

function renderHeader(){
  const c=compile(), errs=validate().filter(i=>i[0]==="error").length;
  $("#meta").textContent = `${c.packages.length} packages · ~${(c.estMb/1024).toFixed(1)} GB`;
  const cta=$("#build");
  cta.disabled = errs>0;
  cta.textContent = errs>0 ? `${errs} thing${errs>1?"s":""} to fix` : "Turn it on";
}

/* Layered auto-layout: rank = longest path from a root, so wires always run
   downward and never cross. Blocks the user has dragged keep their position. */
function layout(){
  const W = canvas.clientWidth || 900, NW = 178;
  const rank = {};
  const depth = (u, seen) => {
    if(rank[u]!=null) return rank[u];
    if(seen.has(u)) return 0;
    seen.add(u);
    const ps = recipe.edges.filter(e=>e.to===u).map(e=>e.from);
    return rank[u] = ps.length ? Math.max(...ps.map(p=>depth(p,seen)))+1 : 0;
  };
  recipe.blocks.forEach(b=>depth(b.uid, new Set()));

  const layers = {};
  recipe.blocks.forEach(b=>{ (layers[rank[b.uid]] = layers[rank[b.uid]] || []).push(b) });

  Object.keys(layers).forEach(k=>{
    const row = layers[k], n = row.length;
    const step = Math.min(200, Math.max(NW + 10, (W - 28) / n));
    const startX = Math.max(14, W/2 - ((n-1)*step)/2 - NW/2);
    row.forEach((b,i)=>{
      if(b.moved) return;
      b.pos = { x: Math.round(startX + i*step), y: 22 + (+k)*102 };
    });
  });
}

function render(){ layout(); renderCanvas(); renderInspector(); renderHeader(); }

/* ------------------------------- actions ------------------------------- */
function addBlock(defId, pos){
  const d=byId(defId);
  if(d.one && recipe.blocks.some(b=>b.def===defId)){
    selected = recipe.blocks.find(b=>b.def===defId).uid;
    render(); return;
  }
  const uid="b"+(++seq);
  recipe.blocks.push({uid, def:defId, cfg:{}, pos: pos || {x:20,y:20}, moved: !!pos});
  // Kid Mode wires the new block to the first compatible parent automatically.
  const parent = recipe.blocks.find(b=>b.uid!==uid && canConnect(b.uid,uid));
  if(parent) recipe.edges.push({from:parent.uid,to:uid});
  selected=uid;
  render();
}

function removeBlock(uid){
  recipe.blocks = recipe.blocks.filter(b=>b.uid!==uid);
  recipe.edges  = recipe.edges.filter(e=>e.from!==uid && e.to!==uid);
  if(selected===uid) selected=null;
  render();
}

function startDrag(ev, b, el){
  if(ev.target.closest(".x")) return;
  b.moved = true;
  selected=b.uid; renderCanvas(); renderInspector();
  const r=canvas.getBoundingClientRect();
  const dx=ev.clientX-r.left-b.pos.x, dy=ev.clientY-r.top-b.pos.y;
  const node=canvas.querySelector(`.node[data-uid="${b.uid}"]`);
  const move=e=>{
    b.pos.x=Math.max(6, Math.min(r.width -(node.offsetWidth+6),  e.clientX-r.left-dx));
    b.pos.y=Math.max(6, Math.min(r.height-(node.offsetHeight+6), e.clientY-r.top -dy));
    node.style.left=b.pos.x+"px"; node.style.top=b.pos.y+"px"; drawWires();
  };
  const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up)};
  document.addEventListener("mousemove",move);
  document.addEventListener("mouseup",up);
}

canvas.addEventListener("dragover", e=>{e.preventDefault(); canvas.classList.add("drag")});
canvas.addEventListener("dragleave", ()=>canvas.classList.remove("drag"));
canvas.addEventListener("drop", e=>{
  e.preventDefault(); canvas.classList.remove("drag");
  const def=e.dataTransfer.getData("text/plain"); if(!def) return;
  const r=canvas.getBoundingClientRect();
  addBlock(def,{x:Math.max(6,e.clientX-r.left-88), y:Math.max(6,e.clientY-r.top-24)});
});
canvas.addEventListener("click", e=>{ if(e.target===canvas||e.target===wires){selected=null; render();} });

$("#osname").addEventListener("input", e=>{ recipe.name=e.target.value; renderHeader(); });
$("#mode-kid").addEventListener("click", ()=>setMode("kid"));
$("#mode-pro").addEventListener("click", ()=>setMode("pro"));
function setMode(m){
  mode=m;
  document.body.className=m;
  $("#mode-kid").setAttribute("aria-selected", m==="kid");
  $("#mode-pro").setAttribute("aria-selected", m==="pro");
  renderPalette(); render();
}

/* ------------------------------ simulator ------------------------------ */
$("#build").addEventListener("click", openSim);

function openSim(){
  const c=compile();
  const panel=c.sim.panel;
  const panelStyle = panel==="top"    ? "top:0;left:0;right:0;height:34px"
                   : panel==="left"   ? "top:0;bottom:0;left:0;width:48px;flex-direction:column;padding:10px 0"
                   : "bottom:0;left:0;right:0;height:40px";
  const wrap=document.createElement("div");
  wrap.className="sim";
  wrap.innerHTML = `
    <div class="machine">
      <div class="chrome"><b>${recipe.name}</b><span>· live preview · no build needed</span>
        <button id="simclose">Close</button></div>
      <div class="screen">
        <div class="boot" id="boot"><div>
          <div class="bn">${recipe.name}</div>
          <div class="bar"><i></i></div>
          <div class="bs">starting up…</div>
        </div></div>
        <div class="desk" id="desk" style="display:none;background:${c.sim.wall}">
          <div class="icons">
            ${c.sim.desktopIcons.map((i,n)=>`<button class="dicon" data-n="${n}">
              <span class="box" style="background:${c.sim.accent}">${icon(i.icon,22)}</span>
              ${i.label}</button>`).join("") ||
              `<p style="color:rgba(255,255,255,.8);font-size:13px;grid-column:1/-1">
                 No apps yet. Drag an app block onto the canvas.</p>`}
          </div>
          <div class="bar-panel" style="${panelStyle}">
            <span class="start" style="background:${c.sim.accent}"></span>
            ${panel==="left" ? "" : `<span style="margin-left:auto">${c.sim.user?c.sim.user+"@":""}${recipe.name.toLowerCase().replace(/[^a-z0-9]/g,"")}</span>`}
          </div>
          ${c.sim.iso ? "" : `<div class="noiso">Preview only — add <b>Make It Real</b> to get a bootable ISO.</div>`}
        </div>
      </div>
    </div>`;
  canvas.parentElement.parentElement.appendChild(wrap);

  const finish=()=>{ wrap.querySelector("#boot").style.display="none";
                     wrap.querySelector("#desk").style.display="block"; };
  setTimeout(finish, 1300);

  wrap.querySelector("#simclose").addEventListener("click", ()=>wrap.remove());
  wrap.addEventListener("click", e=>{
    const b=e.target.closest(".dicon"); if(!b) return;
    const ic=c.sim.desktopIcons[+b.dataset.n];
    wrap.querySelectorAll(".win").forEach(w=>w.remove());
    const w=document.createElement("div");
    w.className="win";
    w.innerHTML=`<div class="t">${icon(ic.icon,15)}<span>${ic.label}</span><button aria-label="Close window">\\u00d7</button></div>
      <div class="c">This app is installed in <b>${recipe.name}</b>.<br><br>
      In a real build it comes from the Debian package listed in
      <code>zenvx.list.chroot</code>.</div>`;
    wrap.querySelector("#desk").appendChild(w);
    w.querySelector("button").addEventListener("click",()=>w.remove());
  });
}

/* ---------------------------- demo recipe ----------------------------- */
renderPalette();
["base.debian","desktop.xfce","look.theme","app.browser","app.paint","app.code","output.iso"]
  .forEach(id=>addBlock(id));
selected=null;
render();
</script>
</body>
